      responses:
        "200":
          description: The meters.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeterList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    put:
      tags: [metering]
      operationId: replaceMeters
      summary: Replace the brand's meters.
      description: |
        Staff `operator` of the brand only. The brand's meters become
        exactly this list. A meter left out is retired, never deleted. Each
        `killbill_unit` must be a usage unit of the brand's catalogue in Kill
        Bill. A brand whose manifest declares `billing.meters` is `409
        conflict`: change the manifest instead. Audited as
        `brand.meters.updated`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/BrandIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MeterReplace"}
      responses:
        "200":
          description: The meters.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeterList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/brands/{id}/quotas:
    get:
      tags: [quotas]
      operationId: listQuotas
      summary: The brand's quotas.
      description: Staff `operator` of the brand only; anyone else gets `404`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/BrandIdPath"
      responses:
        "200":
          description: The quotas.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    put:
      tags: [quotas]
      operationId: replaceQuotas
      summary: Replace the brand's quotas.
      description: |
        Staff `operator` of the brand only. The brand's quotas become
        exactly this list. Each plan must be a plan of the brand's catalogue
        in Kill Bill or `*`, and each meter an active meter of the brand. A
        brand whose manifest declares `entitlements` is `409 conflict`.
