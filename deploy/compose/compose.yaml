# ZSoftly Core reference stack. Development and tests only.
# Run it on a build host, never on a workstation. See README.md.
# Image defaults are pinned by digest and must equal components.yaml; a unit
# test enforces it. The comment after each pin is its tag. A rehearsal
# override in .env may name a plain tag.
name: zs-core

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}  # postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KILLBILL_DB_PASSWORD: ${KILLBILL_DB_PASSWORD:?set in .env}
      KAUI_DB_PASSWORD: ${KAUI_DB_PASSWORD:?set in .env}
      ZS_CORE_DB_PASSWORD: ${ZS_CORE_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/10-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during first start the image runs the init scripts on a
      # server that listens on the unix socket only, so a TCP answer means the
      # init scripts, which create zs_core, have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d zs_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit@sha256:079759020faa42e243a07aaa3e31086de70e93e78b02b844e4149e0108dd5428}  # axllent/mailpit:v1.26.2
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional PDF renderer for invoice PDFs. JavaScript, LibreOffice routes,
  # webhooks and API downloadFrom are disabled. Chromium rejects public and
  # non-public IP destinations for HTTP, HTTPS, WS and WSS. HTML file access
  # is limited to the current request's temporary directory.
  gotenberg:
    image: ${GOTENBERG_IMAGE:-gotenberg/gotenberg@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b}  # gotenberg/gotenberg:8.38.1
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --libreoffice-disable-routes=true
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --api-download-from-deny-public-ips=true
      - --api-download-from-deny-private-ips=true
    ports:
      - "127.0.0.1:${GOTENBERG_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: zs-core/keycloak:local
    build:
      context: ./keycloak
      args:
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244}  # quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      ZS_STAFF_CLIENT_SECRET: ${ZS_STAFF_CLIENT_SECRET:?set in .env}
    volumes:
      - ./keycloak/zs-reference-realm.json:/opt/keycloak/data/import/zs-reference-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_HOST_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r line <&3 &&
          case "$$line" in *' 200 '*) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  killbill-prep:
    image: ${KILLBILL_IMAGE:-killbill/killbill@sha256:e135615bd14f8ff52d258a4b6a936b4cd0276e30a874a7e2c4690f7a1e28f7f1}  # killbill/killbill:0.24.22
    user: root
    entrypoint: ["/bin/sh", "/scripts/prepare-killbill.sh"]
    volumes:
      - ddl:/ddl
      - killbill-plugins:/var/lib/killbill/bundles/plugins
      - ./db/prepare-killbill.sh:/scripts/prepare-killbill.sh:ro
    restart: "no"

  kaui-ddl:
    image: ${KAUI_IMAGE:-killbill/kaui@sha256:5629cc499696a9247fde6ac3b0bbd46e53d8466bd5383f4258865c3e73b7f9d6}  # killbill/kaui:4.0.31
    user: root
    entrypoint: ["/bin/sh", "/scripts/export-kaui-ddl.sh"]
    volumes:
      - ddl:/ddl
      - ./db/export-kaui-ddl.sh:/scripts/export-kaui-ddl.sh:ro
    restart: "no"

  db-init:
    image: ${POSTGRES_IMAGE:-postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}  # postgres:18-alpine
    entrypoint: ["/bin/sh", "/scripts/apply-ddl.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KILLBILL_DB_PASSWORD: ${KILLBILL_DB_PASSWORD:?set in .env}
      KAUI_DB_PASSWORD: ${KAUI_DB_PASSWORD:?set in .env}
    volumes:
      - ddl:/ddl:ro
      - ./db/apply-ddl.sh:/scripts/apply-ddl.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      killbill-prep:
        condition: service_completed_successfully
      kaui-ddl:
        condition: service_completed_successfully
    restart: "no"

  killbill:
    image: ${KILLBILL_IMAGE:-killbill/killbill@sha256:e135615bd14f8ff52d258a4b6a936b4cd0276e30a874a7e2c4690f7a1e28f7f1}  # killbill/killbill:0.24.22
    environment:
      KILLBILL_DAO_URL: jdbc:postgresql://postgres:5432/killbill
      KILLBILL_DAO_USER: killbill
      KILLBILL_DAO_PASSWORD: ${KILLBILL_DB_PASSWORD:?set in .env}
      KB_ADMIN_PASSWORD: ${KILLBILL_ADMIN_PASSWORD:?set in .env}
      KILLBILL_METRICS_INFLUXDB: "false"
      KB_org_killbill_billing_plugin_kpm_adminUsername: admin
      KB_org_killbill_billing_plugin_kpm_adminPassword: ${KILLBILL_ADMIN_PASSWORD:?set in .env}
    volumes:
      - killbill-plugins:/var/lib/killbill/bundles/plugins
      - type: bind
        source: ./killbill/logback.xml
        target: /var/lib/tomcat/logback.xml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./killbill/setenv2.sh
        target: /var/lib/tomcat/bin/setenv2.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KILLBILL_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/1.0/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s
    restart: unless-stopped

  kaui:
    image: ${KAUI_IMAGE:-killbill/kaui@sha256:5629cc499696a9247fde6ac3b0bbd46e53d8466bd5383f4258865c3e73b7f9d6}  # killbill/kaui:4.0.31
    environment:
      KAUI_DB_ADAPTER: postgresql
      KAUI_DB_URL: jdbc:postgresql://postgres:5432/kaui
      KAUI_DB_USERNAME: kaui
      KAUI_DB_PASSWORD: ${KAUI_DB_PASSWORD:?set in .env}
      KAUI_KILLBILL_URL: http://killbill:8080
      KAUI_KILLBILL_API_KEY: ${KILLBILL_TENANT_API_KEY:-zs-reference}
      KAUI_KILLBILL_API_SECRET: ${KILLBILL_TENANT_API_SECRET:?set in .env}
      KAUI_SECRET_KEY_BASE: ${KAUI_SECRET_KEY_BASE:?set in .env}
    depends_on:
      db-init:
        condition: service_completed_successfully
      killbill:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAUI_HOST_PORT:-9090}:8080"
    healthcheck:
      # Probe the sign-in page and require 200, so healthy means the page
      # renders. curl gives up before the probe timeout, so a slow first
      # render is never abandoned and repeated: KAUI 4.0.31 answers 500 on
      # that page until it restarts when several first renders overlap. See
      # README.md.
      test: ["CMD-SHELL", "test \"$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 http://127.0.0.1:8080/users/sign_in)\" = 200"]
      interval: 15s
      timeout: 130s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  core:
    image: zs-core/core:dev
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ZS_DATABASE_URL: postgres://zs_core:${ZS_CORE_DB_PASSWORD:?set in .env}@postgres:5432/zs_core?sslmode=disable
      ZS_LISTEN_ADDR: 0.0.0.0:8080
      ZS_LOG_FORMAT: ${ZS_LOG_FORMAT:-json}
      ZS_KEYCLOAK_URL: http://keycloak:8080
      ZS_KEYCLOAK_REALM: zs-reference
      ZS_KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      ZS_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      ZS_KILLBILL_URL: http://killbill:8080
      ZS_KILLBILL_ADMIN_USER: admin
      ZS_KILLBILL_ADMIN_PASSWORD: ${KILLBILL_ADMIN_PASSWORD:?set in .env}
      ZS_KAUI_URL: http://kaui:8080
      # Kill Bill push notifications: brand apply registers each brand's
      # callback under this URL, which Kill Bill reaches on the compose
      # network, and the secret verifies them.
      ZS_KILLBILL_WEBHOOK_SECRET: ${ZS_KILLBILL_WEBHOOK_SECRET:-}
      ZS_KILLBILL_CALLBACK_URL: http://core:8080
      # Tenant creation and brand apply read the secrets of
      # brands/zs-reference.yaml through these references.
      BRAND_ZS_REFERENCE__KILLBILL_TENANT_API_SECRET: ${KILLBILL_TENANT_API_SECRET:?set in .env}
      BRAND_ZS_REFERENCE__KEYCLOAK_STAFF_CLIENT_SECRET: ${ZS_STAFF_CLIENT_SECRET:?set in .env}
      # Deployment steps only: zs-core plugin ddl apply, doctor and brand
      # apply on the command line read the Kill Bill database. serve never
      # does.
      ZS_KILLBILL_DATABASE_URL: postgres://killbill:${KILLBILL_DB_PASSWORD:?set in .env}@postgres:5432/killbill?sslmode=disable
      ZS_PDF_RENDERER_URL: http://gotenberg:3000
      # The plugin mirror: zs-core plugin mirror sync fills it, serve
      # serves it to KPM. New installs require the URL and secret; KPM
      # never downloads directly from the repository.
      ZS_PLUGIN_MIRROR_DIR: /var/lib/zs-core/plugins
      ZS_PLUGIN_MIRROR_SECRET: ${ZS_PLUGIN_MIRROR_SECRET:?set in .env}
      ZS_PLUGIN_MIRROR_URL: ${ZS_PLUGIN_MIRROR_URL:-http://core:8080}
    volumes:
      - plugin-mirror:/var/lib/zs-core/plugins
      - ../../brands:/app/brands:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CORE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  killbill-plugins:
  ddl:
  plugin-mirror:
