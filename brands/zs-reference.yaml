# The reference brand. It matches the zs-reference realm and Kill Bill tenant
# of the compose stack in deploy/compose. Secrets are references, never
# values, and every reference of this brand starts with BRAND_ZS_REFERENCE__.
# BRAND_ZS_REFERENCE__KEYCLOAK_STAFF_CLIENT_SECRET holds the value of
# ZS_STAFF_CLIENT_SECRET. BRAND_ZS_REFERENCE__KILLBILL_TENANT_API_SECRET holds
# the value of KILLBILL_TENANT_API_SECRET in deploy/compose/.env. ssl_required
# is none for the loopback stack only: the command line warns about it and
# the HTTP route refuses it. The meter api-calls forwards usage to the
# catalogue unit api-call, which core-metered-monthly bills per call. The
# quotas cap api-call per month on that plan and running jobs on every plan.
# Kill Bill renders invoices with zs-reference/invoices/ in English and
# French. Billing email goes through the email-notifications plugin to the
# stack's Mailpit with the templates of zs-reference/email/. The seller
# address and tax number are placeholders. See docs/modules/brands.md,
# docs/modules/invoices.md, docs/modules/metering.md and
# docs/modules/quotas.md.
schema_version: 1
slug: zs-reference
name: ZSoftly reference
identity:
  realm: zs-reference
  display_name: ZSoftly reference
  login_theme: keycloak.v2
  email_theme: keycloak
  locales: [en, fr]
  default_locale: en
  ssl_required: none
  token_lifetimes:
    access_token_seconds: 300
    sso_session_idle_seconds: 1800
    sso_session_max_seconds: 36000
  mfa: optional
  required_actions: []
  customer_client:
    client_id: zs-customer
    name: ZSoftly reference customer client
    redirect_uris: ["http://127.0.0.1/*", "http://localhost/*"]
    web_origins: ["+"]
  staff_client:
    client_id: zs-staff
    name: ZSoftly reference staff client
    secret_ref: env://BRAND_ZS_REFERENCE__KEYCLOAK_STAFF_CLIENT_SECRET
    redirect_uris: ["http://127.0.0.1/*", "http://localhost/*"]
    web_origins: ["+"]
    service_accounts: true
entitlements:
  - feature: api-call
    plan: core-metered-monthly
    limit: 100000
    window: month
    meter: api-calls
  - feature: concurrent-jobs
    plan: "*"
    limit: 2
    window: concurrent
billing:
  killbill_tenant_key: zs-reference
  killbill_api_secret_ref: env://BRAND_ZS_REFERENCE__KILLBILL_TENANT_API_SECRET
  catalogue: zs-reference/catalogue.xml
  overdue: zs-reference/overdue.xml
  currencies: [CAD, USD]
  seller:
    name: ZSoftly Technologies Inc.
    country: CA
    address_lines: ["100 Example Street, Suite 1", "Ottawa, Ontario"]
    tax_registrations: ["GST/HST 000000000 RT0001"]
  invoice_templates:
    template: zs-reference/invoices/invoice.html
    manual_pay_template: zs-reference/invoices/invoice-manual-pay.html
    translations:
      en: zs-reference/invoices/translation-en.properties
      fr: zs-reference/invoices/translation-fr.properties
    catalogue_translations:
      en: zs-reference/invoices/catalogue-en.properties
      fr: zs-reference/invoices/catalogue-fr.properties
  email:
    sender: billing@zs-reference.example.test
    events: [INVOICE_CREATION, INVOICE_PAYMENT_SUCCESS, INVOICE_PAYMENT_FAILED]
    smtp:
      host: mailpit
      port: 1025
    templates: zs-reference/email
  wallet:
    overdraft_minor: 0
    low_balance_minor: 500
  usage_window:
    backfill_hours: 168
    future_seconds: 300
  meters:
    - slug: api-calls
      unit: request
      killbill_unit: api-call
      dimensions: [region, method]
