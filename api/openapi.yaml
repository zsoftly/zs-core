      tags: [wallet]
      operationId: staffReleaseReservation
      summary: Release another holder's reservation, as staff.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. Needs a reason. Releases as the holder's route
        does, and is audited as `wallet.reservation.staff_override`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ReservationRefPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StaffReservationRelease"}
      responses:
        "200":
          description: The released reservation.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/reservations/{ref}/extend:
    post:
      tags: [wallet]
      operationId: staffExtendReservation
      summary: Extend another holder's reservation, as staff.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. Needs a reason. Extends as the holder's route does,
        and is audited as `wallet.reservation.staff_override`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ReservationRefPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StaffReservationExtend"}
      responses:
        "200":
          description: The reservation with its new lease.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/entitlements/{feature}/release:
    post:
      tags: [quotas]
      operationId: staffReleaseEntitlement
      summary: Release another holder's quota lease, as staff.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. Needs a reason. Releases as the holder's route
        does, and is audited as `quota.lease.staff_override`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/FeaturePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StaffQuotaRelease"}
      responses:
        "200":
          description: What was returned, and the entitlement after.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaReleased"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/usage/rollups/{rollup}/reassign:
    post:
      tags: [metering]
      operationId: reassignUsageRollup
      summary: Send a rejected usage rollup to another subscription.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. Needs a reason. The rollup must be rejected, and
        the subscription an active subscription of the tenant that prices
        the rollup's unit and started by the start of the rollup's period.
        The forwarder sends it on its next pass. Audited as
        `metering.rollup_reassigned`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/RollupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageRollupReassign"}
      responses:
        "200":
          description: The rollup, pending again.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageRollup"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/usage/rollups/{rollup}/discard:
    post:
      tags: [metering]
      operationId: discardUsageRollup
      summary: Give up a rejected usage rollup.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. Needs a reason. The rollup must be rejected. It is
        never sent and its usage is not billed. Audited as
        `metering.rollup_discarded`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/RollupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageRollupDiscard"}
      responses:
        "200":
          description: The discarded rollup.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageRollup"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A Keycloak access token from the brand's realm, signed with RS256, or a tenant API key `zs_<brand slug>_<random>`.
    mirrorSecret:
      type: http
      scheme: bearer
      description: The deployment's `ZS_PLUGIN_MIRROR_SECRET`, for the plugin mirror only.
    billingCredential:
      type: http
      scheme: bearer
      description: A billing credential `zsbc_...` from `GET /v1/tenants/{id}/billing/credentials`, valid for 15 minutes.
  headers:
    RequestId:
      description: The request ID. A valid inbound `X-Request-ID` is echoed; otherwise the server assigns one.
      schema: {type: string, maxLength: 128}
    CacheControl:
      description: Always `no-store`.
      schema: {type: string, const: no-store}
  parameters:
    BrandIdPath:
      name: id
      in: path
      required: true
      description: A brand ID.
      schema: {$ref: "#/components/schemas/BrandId"}
    TenantIdPath:
      name: id
      in: path
      required: true
      description: A tenant ID. A tenant the caller is not an active member of answers `404 tenant_not_found`.
      schema: {$ref: "#/components/schemas/TenantId"}
    MembershipIdPath:
      name: mem
      in: path
      required: true
      description: A membership ID.
      schema: {$ref: "#/components/schemas/MembershipId"}
    TeamIdPath:
      name: tm
      in: path
      required: true
      description: A team ID.
      schema: {$ref: "#/components/schemas/TeamId"}
    InvitationIdPath:
      name: inv
      in: path
      required: true
      description: An invitation ID.
      schema: {$ref: "#/components/schemas/InvitationId"}
    ApiKeyIdPath:
      name: key
      in: path
      required: true
      description: An API key ID.
      schema: {$ref: "#/components/schemas/ApiKeyId"}
    SubscriptionIdPath:
      name: sub
      in: path
      required: true
      description: A Kill Bill subscription ID of the tenant.
      schema: {$ref: "#/components/schemas/KillBillId"}
    InvoiceIdPath:
      name: inv
      in: path
      required: true
      description: A Kill Bill invoice ID of the tenant.
      schema: {$ref: "#/components/schemas/KillBillId"}
    PaymentIdPath:
      name: pay
      in: path
      required: true
      description: A Kill Bill payment ID of the tenant.
      schema: {$ref: "#/components/schemas/KillBillId"}
    PaymentMethodIdPath:
      name: pm
      in: path
      required: true
      description: A Kill Bill payment method ID of the tenant.
      schema: {$ref: "#/components/schemas/KillBillId"}
    ProxyPath:
      name: path
      in: path
      required: true
      description: A Kill Bill path such as `1.0/kb/accounts/<account_id>`. It may hold slashes.
      schema: {type: string}
    ReservationRefPath:
      name: ref
      in: path
      required: true
      description: The reservation's external reference.
      schema: {$ref: "#/components/schemas/ExternalRef"}
    RollupIdPath:
      name: rollup
      in: path
      required: true
      description: A usage rollup ID.
      schema: {type: string, pattern: "^rol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
    FeaturePath:
      name: feature
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$"}
    MeterQuery:
      name: meter
      in: query
      description: A meter slug.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
    FromDay:
      name: from
      in: query
      description: The first day, YYYY-MM-DD, UTC.
      schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
    ToDay:
      name: to
      in: query
      description: The day after the last, YYYY-MM-DD, UTC.
      schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
    Limit:
      name: limit
      in: query
      description: The page size. Defaults to 50.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque; do not build or parse it.
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    BadRequest:
      description: The request is invalid.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Authenticated but not allowed, such as `recent_mfa_required`.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Not found, or not visible to the caller.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Conflict:
      description: Conflicts with the current state, such as `brand_apply_in_progress`.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unprocessable:
      description: An engine rejected the request, or a secret reference could not be resolved.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unauthenticated:
      description: No valid token. `unauthenticated`, `token_invalid` or `token_audience_unknown`.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unavailable:
      description: A dependency is unavailable. Retry later.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    ErrorEnvelope:
      type: object
      description: The body of every error response.
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}
    Error:
      type: object
      required: [code, message, retryable]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable code in snake_case. Clients branch on this value.
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          examples: [idempotency_key_conflict]
        message:
          type: string
          description: A safe human-readable message. Never contains dependency or provider text.
        retryable:
          type: boolean
          description: True when the same request may succeed later.
    NextCursor:
      type: [string, "null"]
      description: The cursor for the next page, or null on the last page.
      maxLength: 128
    IdempotencyKey:
      type: string
      description: |
        Client-chosen key that makes a command safe to retry. Scoped to the
        brand, the tenant and the actor. A retry with the same payload returns
        the original result; a different payload returns `409
        idempotency_key_conflict`.
      minLength: 8
      maxLength: 255
      pattern: "^[\\x21-\\x7E]+$"
    HealthStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, ready]
    BrandId:
      type: string
      description: A brand ID.
      pattern: "^brd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TenantId:
      type: string
      description: A tenant ID.
      pattern: "^tnt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    AuditEventId:
      type: string
      description: An audit event ID.
      pattern: "^aud_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    Action:
      type: string
      description: A dotted lowercase action name.
      pattern: "^[a-z0-9_]+(\\.[a-z0-9_]+)+$"
      maxLength: 120
    Actor:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [user, api_key, staff, service, provider, system]
        id:
          type: string
          description: The actor ID. Absent only for the system actor.
          maxLength: 255
    AuditOutcome:
      type: string
      enum: [success, failure, denied]
    AuditEvent:
      type: object
      required: [id, brand_id, tenant_id, actor, action, outcome, correlation_id, occurred_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/AuditEventId"}
        brand_id: {$ref: "#/components/schemas/BrandId"}
        tenant_id:
          description: The tenant, or null for a brand event.
          oneOf:
            - {$ref: "#/components/schemas/TenantId"}
            - {type: "null"}
        actor: {$ref: "#/components/schemas/Actor"}
        action: {$ref: "#/components/schemas/Action"}
        reason:
          type: string
          maxLength: 1000
        outcome: {$ref: "#/components/schemas/AuditOutcome"}
        correlation_id:
          type: string
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
        details:
          type: object
          description: Structured detail, such as the diff of a brand apply. Never holds secrets.
          additionalProperties: true
    AuditEventPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    IdentityId:
      type: string
      description: An identity ID.
      pattern: "^idn_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    Identity:
      type: object
      required: [id, brand_id, kind, issuer, subject, email, email_verified, display_name, mfa, authenticated_at]
      additionalProperties: false
      properties:
        id:
          description: The identity, or null until the first request with a verified email.
          oneOf:
            - {$ref: "#/components/schemas/IdentityId"}
            - {type: "null"}
        brand_id: {$ref: "#/components/schemas/BrandId"}
        kind:
          type: string
          description: Which of the brand's clients issued the token.
          enum: [user, staff, service]
        issuer: {type: string}
        subject: {type: string}
        email: {type: [string, "null"]}
        email_verified: {type: boolean}
        display_name: {type: [string, "null"]}
        mfa:
          type: boolean
          description: True when the token's amr or acr proves a second factor.
        authenticated_at:
          type: [string, "null"]
          format: date-time
    Membership:
      type: object
      description: An active membership of the caller, with its tenant.
      required: [id, role, status, tenant]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/MembershipId"}
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [active]}
        tenant: {$ref: "#/components/schemas/Tenant"}
    Me:
      type: object
      required: [identity, memberships]
      additionalProperties: false
      properties:
        identity: {$ref: "#/components/schemas/Identity"}
        memberships:
          type: array
          items: {$ref: "#/components/schemas/Membership"}
    Brand:
      type: object
      required: [id, slug, name, status, keycloak_realm, killbill_tenant_id, killbill_api_key, manifest_digest, applied_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/BrandId"}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, disabled]}
        keycloak_realm: {type: string}
        killbill_tenant_id: {type: [string, "null"]}
        killbill_api_key: {type: string}
        manifest_digest: {type: string}
        applied_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BrandManifest:
      type: object
      description: A brand manifest. The full schema is `api/schemas/brand-manifest.json`; the server validates against it and rejects unknown keys.
      additionalProperties: true
    BrandFieldChange:
      type: object
      required: [field]
      additionalProperties: false
      properties:
        field: {type: string}
        before:
          description: The current value. Absent for a new object or a redacted field.
        after:
          description: The desired value. Absent for a redacted field.
        redacted:
          type: boolean
          description: True for secrets; neither value is shown.
    BrandChange:
      type: object
      required: [target, name, action, fields]
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [core.brand, keycloak.realm, keycloak.authentication_flow, keycloak.required_action, keycloak.client, keycloak.client_scope, keycloak.identity_provider, keycloak.mfa_policy, killbill.tenant, killbill.catalogue, killbill.overdue, killbill.plugin_config, killbill.plugin, killbill.notification_callback, core.meters, core.quotas]
        name: {type: string}
        action: {type: string, enum: [create, update]}
        fields:
          type: array
          items: {$ref: "#/components/schemas/BrandFieldChange"}
    BrandDiff:
      type: object
      required: [slug, manifest_digest, changes, applied]
      additionalProperties: false
      properties:
        brand_id: {$ref: "#/components/schemas/BrandId"}
        slug: {type: string}
        manifest_digest_before: {type: string}
        manifest_digest: {type: string}
        changes:
          type: array
          items: {$ref: "#/components/schemas/BrandChange"}
        applied: {type: boolean}
    MembershipId:
      type: string
      description: A membership ID.
      pattern: "^mem_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TeamId:
      type: string
      description: A team ID.
      pattern: "^tm_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    InvitationId:
      type: string
      description: An invitation ID.
      pattern: "^inv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    ApiKeyId:
      type: string
      description: An API key ID.
      pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    Permission:
      type: string
      description: A `resource:action` permission, built in or registered by the brand.
      pattern: "^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$"
      maxLength: 100
    Role:
      type: string
      description: |
        `owner` holds every permission. `admin` holds every permission except
        `billing:*` and `tenant:transfer`. `billing_admin` holds `billing:*`.
        `member` holds what its teams grant.
      enum: [owner, admin, billing_admin, member]
    BillingCountry:
      type: string
      description: An ISO 3166-1 alpha-2 country code in upper case.
      pattern: "^[A-Z]{2}$"
    Tenant:
      type: object
      required: [id, brand_id, kind, slug, name, status, activation, billing_country, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/TenantId"}
        brand_id: {$ref: "#/components/schemas/BrandId"}
        kind: {type: string, enum: [personal, organization]}
        slug: {type: string}
        name: {type: string, minLength: 1, maxLength: 100}
        status:
          type: string
          description: "`suspended` blocks every write and keeps reads. `closed` is terminal."
          enum: [active, suspended, closed]
        activation: {type: string, enum: [pending, approved, rejected]}
        billing_country: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TenantCreate:
      type: object
      required: [idempotency_key, name]
      additionalProperties: false
      properties:
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        name: {type: string, minLength: 1, maxLength: 100}
        billing_country: {$ref: "#/components/schemas/BillingCountry"}
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        billing_country:
          description: A country code, or an empty string to clear it.
          type: string
          pattern: "^([A-Z]{2})?$"
    Member:
      type: object
      required: [id, tenant_id, identity_id, email, display_name, role, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/MembershipId"}
        tenant_id: {$ref: "#/components/schemas/TenantId"}
        identity_id: {$ref: "#/components/schemas/IdentityId"}
        email: {type: [string, "null"]}
        display_name: {type: [string, "null"]}
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [active, suspended, removed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MemberPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Member"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role: {$ref: "#/components/schemas/Role"}
        status:
          type: string
          description: Suspend or reinstate a member. Remove a member with DELETE.
          enum: [active, suspended]
    OwnershipTransfer:
      type: object
      required: [membership_id]
      additionalProperties: false
      properties:
        membership_id: {$ref: "#/components/schemas/MembershipId"}
    OwnershipTransferResult:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: {$ref: "#/components/schemas/Member"}
        to: {$ref: "#/components/schemas/Member"}
    Team:
      type: object
      required: [id, name, system, locked, permissions, membership_ids, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/TeamId"}
        name: {type: string}
        system:
          type: boolean
          description: True for `owners`, `admins` and `members`, which follow the membership roles.
        locked:
          type: boolean
          description: True when Core manages the team's name and members. Its grants can still change.
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        membership_ids:
          type: array
          items: {$ref: "#/components/schemas/MembershipId"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TeamPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Team"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    TeamCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    TeamUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    TeamMembers:
      type: object
      required: [membership_ids]
      additionalProperties: false
      properties:
        membership_ids:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/MembershipId"}
    TeamGrants:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/Permission"}
    Invitation:
      type: object
      required: [id, tenant_id, email, role, status, expires_at, accepted_at, revoked_at, created_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/InvitationId"}
        tenant_id: {$ref: "#/components/schemas/TenantId"}
        email: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [pending, accepted, revoked, expired]}
        expires_at: {type: string, format: date-time}
        accepted_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    InvitationPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Invitation"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    InvitationCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 3, maxLength: 320}
        role: {type: string, enum: [admin, billing_admin, member]}
    InvitationCreated:
      type: object
      required: [invitation, token]
      additionalProperties: false
      properties:
        invitation: {$ref: "#/components/schemas/Invitation"}
        token:
          type: string
          description: The clear invitation token. Shown once and never stored.
    InvitationAccept:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 1, maxLength: 128}
    InvitationAccepted:
      type: object
      required: [membership, tenant]
      additionalProperties: false
      properties:
        membership: {$ref: "#/components/schemas/Member"}
        tenant: {$ref: "#/components/schemas/Tenant"}
    ActivationDecision:
      type: object
      required: [state, reason, request_id, actor, decided_at]
      additionalProperties: false
      properties:
        state: {type: string, enum: [pending, approved, rejected]}
        reason: {type: string}
        request_id: {type: string}
        actor: {$ref: "#/components/schemas/Actor"}
        decided_at: {type: string, format: date-time}
    ActivationDecisionRequest:
      type: object
      required: [state, reason, request_id]
      additionalProperties: false
      properties:
        state: {type: string, enum: [pending, approved, rejected]}
        reason: {type: string, minLength: 1, maxLength: 1000}
        request_id:
          type: string
          description: Client-chosen ID that makes the decision safe to retry.
          minLength: 8
          maxLength: 255
          pattern: "^[\\x21-\\x7E]+$"
    ActivationState:
      type: object
      required: [state, decisions]
      additionalProperties: false
      properties:
        state: {type: string, enum: [pending, approved, rejected]}
        decisions:
          type: array
          items: {$ref: "#/components/schemas/ActivationDecision"}
    ApiKey:
      type: object
      required: [id, tenant_id, name, prefix, permissions, created_by_membership_id, expires_at, last_used_at, revoked_at, created_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ApiKeyId"}
        tenant_id: {$ref: "#/components/schemas/TenantId"}
        name: {type: string}
        prefix:
          type: string
          description: The start of the secret, for display.
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        created_by_membership_id: {$ref: "#/components/schemas/MembershipId"}
        expires_at: {type: string, format: date-time}
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    ApiKeyPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ApiKey"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    ApiKeyCreate:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: "#/components/schemas/Permission"}
        expires_at:
          type: string
          format: date-time
          description: Defaults to 90 days from now. At most 365 days from now.
    ApiKeyCreated:
      type: object
      required: [api_key, secret]
      additionalProperties: false
      properties:
        api_key: {$ref: "#/components/schemas/ApiKey"}
        secret:
          type: string
          description: "`zs_<brand slug>_<random>`. Shown once and never stored."
    KillBillId:
      type: string
      description: The ID of an object that lives in Kill Bill only, such as a subscription, invoice, payment or payment method. Core never maps it to a Core ID.
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Currency:
      type: string
      description: An ISO 4217 currency code.
      pattern: "^[A-Z]{3}$"
    Money:
      type: object
      required: [currency, amount_minor]
      additionalProperties: false
      properties:
        currency: {$ref: "#/components/schemas/Currency"}
        amount_minor: {type: integer, format: int64, description: "The amount in minor units of the currency, such as cents."}
    Catalogue:
      type: object
      required: [name, effective_date, currencies, units, products]
      additionalProperties: false
      properties:
        name: {type: string}
        effective_date: {type: string}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/Currency"}
        units:
          type: array
          items: {type: string}
        products:
          type: array
          items: {$ref: "#/components/schemas/CatalogueProduct"}
    CatalogueProduct:
      type: object
      required: [name, category, features, plans]
      additionalProperties: false
      properties:
        name: {type: string}
        pretty_name: {type: string}
        category: {type: string, description: "BASE, ADD_ON or STANDALONE."}
        features:
          type: array
          description: What an active subscription to a plan of the product entitles to, the product name and the usage units of its plans.
          items: {type: string}
        plans:
          type: array
          items: {$ref: "#/components/schemas/CataloguePlan"}
    CataloguePlan:
      type: object
      required: [name, billing_period, phases]
      additionalProperties: false
      properties:
        name: {type: string}
        pretty_name: {type: string}
        billing_period: {type: string}
        phases:
          type: array
          items: {$ref: "#/components/schemas/CataloguePhase"}
    CataloguePhase:
      type: object
      required: [type, duration, fixed_prices, recurring_prices, usage]
      additionalProperties: false
      properties:
        type: {type: string, description: "TRIAL, DISCOUNT, FIXEDTERM or EVERGREEN."}
        duration:
          oneOf:
            - {$ref: "#/components/schemas/PhaseDuration"}
            - {type: "null"}
          description: Null for an unlimited phase.
        fixed_prices:
          type: array
          items: {$ref: "#/components/schemas/Money"}
        recurring_prices:
          type: array
          items: {$ref: "#/components/schemas/Money"}
        usage:
          type: array
          items: {$ref: "#/components/schemas/UsagePrice"}
    PhaseDuration:
      type: object
      required: [unit, number]
      additionalProperties: false
      properties:
        unit: {type: string}
        number: {type: integer}
    UsagePrice:
      type: object
      required: [unit, block_size, prices]
      additionalProperties: false
      properties:
        unit: {type: string}
        block_size: {type: string}
        prices:
          type: array
          items: {$ref: "#/components/schemas/Money"}
    BillingSummary:
      type: object
      required: [currency, balance_minor, credit_minor, overdue, on_hold, hold_reasons, payment_plugin]
      additionalProperties: false
      properties:
        currency: {$ref: "#/components/schemas/Currency"}
        balance_minor: {type: integer, format: int64, description: "What the account owes in minor units, negative when it holds credit."}
        credit_minor: {type: integer, format: int64, description: The account credit in minor units.}
        overdue: {$ref: "#/components/schemas/OverdueState"}
        on_hold: {type: boolean}
        hold_reasons:
          type: array
          items:
            type: string
            enum: [tenant_suspended, account_blocked, overdue_blocks_changes, overdue_disables_entitlement]
        payment_plugin: {type: string, description: "The Kill Bill payment plugin of the brand, or __EXTERNAL_PAYMENT__."}
    OverdueState:
      type: object
      required: [state, clear, blocks_changes, disables_entitlement]
      additionalProperties: false
      properties:
        state: {type: string}
        clear: {type: boolean}
        blocks_changes: {type: boolean}
        disables_entitlement: {type: boolean}
    Subscription:
      type: object
      required: [id, bundle_id, product, category, plan, phase, billing_period, state]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/KillBillId"}
        bundle_id: {type: string}
        product: {type: string}
        category: {type: string}
        plan: {type: string}
        phase: {type: string}
        billing_period: {type: string}
        state: {type: string, description: "PENDING, ACTIVE, BLOCKED, CANCELLED or EXPIRED."}
        start_date: {type: string}
        charged_through_date: {type: string}
        cancelled_date: {type: string}
        billing_end_date: {type: string}
    SubscriptionList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Subscription"}
    SubscriptionCreate:
      type: object
      required: [plan, idempotency_key]
      additionalProperties: false
      properties:
        plan: {type: string, minLength: 1, maxLength: 255}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        reason: {type: string, maxLength: 1000, description: Recorded in Kill Bill's audit log.}
    SubscriptionChange:
      type: object
      required: [plan, policy]
      additionalProperties: false
      properties:
        plan: {type: string, minLength: 1, maxLength: 255}
        policy: {type: string, enum: [immediate, end_of_term]}
        reason: {type: string, maxLength: 1000, description: Recorded in Kill Bill's audit log.}
    Entitlement:
      type: object
      required: [allowed, limit, used, remaining, reason]
      additionalProperties: false
      properties:
        allowed: {type: boolean}
        limit: {type: [integer, "null"], format: int64}
        used: {type: [integer, "null"], format: int64}
        remaining: {type: [integer, "null"], format: int64}
        reason:
          type: string
          enum: [included_in_plan, no_active_subscription, feature_not_in_plan, wallet_on_hold, billing_unavailable, tenant_not_found, feature_invalid, quota_exceeded]
        plan: {type: string, description: "The plan that grants the feature, when allowed."}
        window: {$ref: "#/components/schemas/QuotaWindow"}
    Invoice:
      type: object
      required: [id, number, date, target_date, status, currency, amount_minor, balance_minor, credit_adj_minor, refund_adj_minor]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/KillBillId"}
        number: {type: string}
        date: {type: string}
        target_date: {type: string}
        status: {type: string, description: "DRAFT, COMMITTED or VOID."}
        currency: {$ref: "#/components/schemas/Currency"}
        amount_minor: {type: integer, format: int64}
        balance_minor: {type: integer, format: int64}
        credit_adj_minor: {type: integer, format: int64}
        refund_adj_minor: {type: integer, format: int64}
        items:
          type: array
          description: The lines, on a single invoice only.
          items: {$ref: "#/components/schemas/InvoiceItem"}
    InvoiceItem:
      type: object
      required: [id, type, amount_minor, currency]
      additionalProperties: false
      properties:
        id: {type: string}
        type: {type: string}
        description: {type: string}
        subscription_id: {type: string}
        product: {type: string}
        plan: {type: string}
        phase: {type: string}
        usage: {type: string}
        start_date: {type: string}
        end_date: {type: string}
        amount_minor: {type: integer, format: int64}
        currency: {$ref: "#/components/schemas/Currency"}
    InvoicePage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Invoice"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    Payment:
      type: object
      required: [id, number, currency, payment_method_id, auth_minor, captured_minor, purchased_minor, refunded_minor, credited_minor, transactions]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/KillBillId"}
        number: {type: string}
        currency: {$ref: "#/components/schemas/Currency"}
        payment_method_id: {type: string}
        auth_minor: {type: integer, format: int64}
        captured_minor: {type: integer, format: int64}
        purchased_minor: {type: integer, format: int64}
        refunded_minor: {type: integer, format: int64}
        credited_minor: {type: integer, format: int64}
        transactions:
          type: array
          items: {$ref: "#/components/schemas/PaymentTransaction"}
    PaymentTransaction:
      type: object
      required: [id, type, status, effective_date, amount_minor, currency]
      additionalProperties: false
      properties:
        id: {type: string}
        type: {type: string}
        status: {type: string}
        effective_date: {type: string}
        amount_minor: {type: integer, format: int64}
        currency: {$ref: "#/components/schemas/Currency"}
    PaymentPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Payment"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    RefundRequest:
      type: object
      required: [amount_minor, reason, idempotency_key]
      additionalProperties: false
      properties:
        amount_minor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    PaymentMethod:
      type: object
      required: [id, plugin_name, is_default]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/KillBillId"}
        plugin_name: {type: string}
        is_default: {type: boolean}
    PaymentMethodList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentMethod"}
    PluginProperty:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key: {type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$"}
        value: {type: string, maxLength: 2048}
    PaymentMethodCreate:
      type: object
      required: [idempotency_key]
      additionalProperties: false
      properties:
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        set_default: {type: boolean, default: false}
        hosted_page: {type: boolean, default: false, description: Ask the plugin for its hosted payment page.}
        hosted_page_fields:
          type: array
          maxItems: 20
          description: Fields the plugin's hosted page takes, such as return URLs.
          items: {$ref: "#/components/schemas/PluginProperty"}
        external_payment_method_id:
          type: string
          maxLength: 255
          description: The token the provider's own client library made, such as a Stripe payment method ID. Never card data.
        plugin_properties:
          type: array
          maxItems: 20
          description: Properties passed to the plugin. Never logged.
          items: {$ref: "#/components/schemas/PluginProperty"}
    HostedForm:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        method: {type: string}
        url: {type: string}
        fields:
          type: object
          description: What the plugin returned, such as a provider session ID.
    PaymentMethodAdded:
      type: object
      required: [payment_method]
      additionalProperties: false
      properties:
        payment_method:
          oneOf:
            - {$ref: "#/components/schemas/PaymentMethod"}
            - {type: "null"}
        form: {$ref: "#/components/schemas/HostedForm"}
    CreditRedeem:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, minLength: 4, maxLength: 64}
    CreditGrant:
      type: object
      required: [amount_minor, currency, reason, idempotency_key]
      additionalProperties: false
      properties:
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {$ref: "#/components/schemas/Currency"}
        reason: {type: string, minLength: 1, maxLength: 1000}
        expires_at: {type: string, format: date-time, description: When the sweeper reverses the unused part. Within 10 years.}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    Credit:
      type: object
      required: [id, source, amount_minor, currency, killbill_credit_id, expires_at, expired_at, reversed_minor, created_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^crd_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        source: {type: string, enum: [credit_code, staff]}
        credit_code_id: {type: string, pattern: "^ccd_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        amount_minor: {type: integer, format: int64}
        currency: {$ref: "#/components/schemas/Currency"}
        killbill_credit_id: {$ref: "#/components/schemas/KillBillId"}
        expires_at: {type: [string, "null"], format: date-time}
        expired_at: {type: [string, "null"], format: date-time}
        reversed_minor: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    BillingCredential:
      type: object
      required: [token, expires_at, proxy_path, account_id, account_external_key]
      additionalProperties: false
      properties:
        token: {type: string, description: "`zsbc_...`. Valid for 15 minutes."}
        expires_at: {type: string, format: date-time}
        proxy_path: {type: string, description: The proxy route of the tenant.}
        account_id: {$ref: "#/components/schemas/KillBillId"}
        account_external_key: {$ref: "#/components/schemas/TenantId"}
    KillBillNotification:
      type: object
      required: [eventType]
      properties:
        eventType: {type: string}
        accountId: {type: [string, "null"]}
        objectType: {type: string}
        objectId: {type: string}
        metaData: {type: [string, "null"]}
    ExternalRef:
      type: string
      description: A caller's key, such as a job ID. Letters, digits, dots, colons, dashes and underscores.
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
    ReservationId:
      type: string
      description: A reservation ID.
      pattern: "^rsv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    WalletView:
      type: object
      required: [currency, killbill_credit_minor, unbilled_minor, reserved_minor, available_minor, overdraft_minor, pending_settlements, overdue, on_hold, hold_reasons, low_balance, low_balance_threshold_minor]
      additionalProperties: false
      properties:
        currency: {$ref: "#/components/schemas/Currency"}
        killbill_credit_minor: {type: integer, format: int64, description: "The account credit Kill Bill holds, in minor units."}
        unbilled_minor: {type: [integer, "null"], format: int64, description: "What Kill Bill will invoice by the end of the current period and has not yet: usage recorded so far and recurring charges due by then, from a dry-run invoice. Null when Kill Bill cannot rate it."}
        reserved_minor: {type: integer, format: int64, description: "The sum of the held reservations, pending settlements included."}
        available_minor: {type: [integer, "null"], format: int64, description: "The credit less the unbilled amount and the holds, never below minus overdraft_minor. Null when unbilled_minor is null."}
        overdraft_minor: {type: integer, format: int64, description: The brand's overdraft allowance.}
        pending_settlements: {type: integer, description: Held reservations whose settlement waits for Kill Bill.}
        overdue: {$ref: "#/components/schemas/OverdueState"}
        on_hold: {type: boolean}
        hold_reasons:
          type: array
          items:
            type: string
            enum: [tenant_suspended, account_blocked, overdue_blocks_changes, overdue_disables_entitlement]
        low_balance: {type: boolean}
        low_balance_threshold_minor: {type: integer, format: int64, description: "The brand's threshold. 0 turns it off."}
    Reservation:
      type: object
      required: [id, external_ref, attempt, label, currency, amount_minor, status, lease_expires_at, settlement_pending, settled_minor, created_at, updated_at, settled_at, released_at, expired_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ReservationId"}
        external_ref: {$ref: "#/components/schemas/ExternalRef"}
        attempt: {type: integer}
        label: {type: string}
        currency: {$ref: "#/components/schemas/Currency"}
        amount_minor: {type: integer, format: int64, description: The amount held.}
        status: {type: string, enum: [held, settled, released, expired]}
        lease_expires_at: {type: string, format: date-time}
        settlement_pending: {type: boolean, description: "A settlement waits for Kill Bill. The hold keeps counting."}
        settled_minor: {type: [integer, "null"], format: int64, description: "The charge of a credit settlement, or the catalogue estimate of a usage settlement."}
        rated_by: {type: string, enum: [external_charge, catalogue_price, unrated]}
        killbill_ref_type: {type: string, enum: [usage_record, external_charge]}
        killbill_ref: {type: string, description: "The usage record's tracking ID or the external charge's invoice item ID."}
        killbill_subscription_id: {$ref: "#/components/schemas/KillBillId"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        settled_at: {type: [string, "null"], format: date-time}
        released_at: {type: [string, "null"], format: date-time}
        expired_at: {type: [string, "null"], format: date-time}
    ReservationPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Reservation"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    ReservationCreate:
      type: object
      required: [external_ref, amount_minor]
      additionalProperties: false
      properties:
        external_ref: {$ref: "#/components/schemas/ExternalRef"}
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        label: {type: string, maxLength: 200}
        amount_minor: {type: integer, format: int64, minimum: 1, maximum: 10000000000}
        currency: {$ref: "#/components/schemas/Currency"}
        lease_seconds: {type: integer, minimum: 10, maximum: 86400, description: "Defaults to 900."}
    UsageSettlement:
      type: object
      required: [unit, quantity_micro]
      additionalProperties: false
      properties:
        subscription: {$ref: "#/components/schemas/KillBillId"}
        unit: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$", description: A usage unit of the catalogue.}
        quantity_micro: {type: integer, format: int64, minimum: 1, maximum: 1000000000000000}
        event_id: {type: string, pattern: "^[\\x21-\\x7E]{1,255}$"}
    ReservationSettle:
      type: object
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        usage: {$ref: "#/components/schemas/UsageSettlement"}
        credit_minor: {type: integer, format: int64, minimum: 1, maximum: 10000000000}
        reason: {type: string, maxLength: 1000, description: Recorded in Kill Bill's audit log.}
    ReservationRelease:
      type: object
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
    StaffReservationSettle:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        usage: {$ref: "#/components/schemas/UsageSettlement"}
        credit_minor: {type: integer, format: int64, minimum: 1, maximum: 10000000000}
        reason: {type: string, minLength: 1, maxLength: 1000}
    StaffReservationRelease:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    StaffReservationExtend:
      type: object
      required: [lease_seconds, reason]
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        lease_seconds: {type: integer, minimum: 10, maximum: 86400}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ReservationExtend:
      type: object
      required: [lease_seconds]
      additionalProperties: false
      properties:
        attempt: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        lease_seconds: {type: integer, minimum: 10, maximum: 86400}
    UsageId:
      type: string
      description: A usage event ID.
      pattern: "^usg_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    Dimensions:
      type: object
      description: Keys the meter declares, with values of 1 to 200 characters.
      additionalProperties: {type: string, minLength: 1, maxLength: 200}
    UsageEventCreate:
      type: object
      required: [meter, event_id, quantity_micro]
      additionalProperties: false
      properties:
        meter: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        event_id: {type: string, pattern: "^[\\x21-\\x7E]{1,255}$"}
        quantity_micro: {type: integer, format: int64, minimum: 1, maximum: 1000000000000000, description: Millionths of the meter's unit.}
        occurred_at: {type: string, format: date-time, description: Defaults to now.}
        dimensions: {$ref: "#/components/schemas/Dimensions"}
        resource_ref: {type: string, maxLength: 255}
        subscription: {$ref: "#/components/schemas/KillBillId"}
    UsageEvent:
      type: object
      required: [id, meter, event_id, quantity_micro, dimensions, occurred_at, received_at, forwarded_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/UsageId"}
        meter: {type: string}
        event_id: {type: string}
        quantity_micro: {type: integer, format: int64}
        dimensions: {$ref: "#/components/schemas/Dimensions"}
        resource_ref: {type: string}
        subscription: {$ref: "#/components/schemas/KillBillId"}
        reservation_id: {$ref: "#/components/schemas/ReservationId"}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        forwarded_at: {type: [string, "null"], format: date-time, description: When the forwarder sent the event to Kill Bill.}
        killbill_tracking_id: {type: string}
    UsageBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/UsageEventCreate"}
    UsageBatchItem:
      type: object
      required: [usage, replayed]
      additionalProperties: false
      properties:
        usage: {$ref: "#/components/schemas/UsageEvent"}
        replayed: {type: boolean, description: True when the event was recorded before.}
    UsageBatchResult:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/UsageBatchItem"}
    UsageEventPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/UsageEvent"}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    UsageSummaryTotal:
      type: object
      required: [meter, unit, quantity_micro, events]
      additionalProperties: false
      properties:
        meter: {type: string}
        unit: {type: string}
        quantity_micro: {type: integer, format: int64}
        events: {type: integer, format: int64}
    UsageSummaryRow:
      type: object
      required: [meter, day, dimensions, quantity_micro, events]
      additionalProperties: false
      properties:
        meter: {type: string}
        day: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        dimensions: {$ref: "#/components/schemas/Dimensions"}
        quantity_micro: {type: integer, format: int64}
        events: {type: integer, format: int64}
    UsageSummary:
      type: object
      required: [from, to, totals, rows]
      additionalProperties: false
      properties:
        from: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        to: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        totals:
          type: array
          items: {$ref: "#/components/schemas/UsageSummaryTotal"}
        rows:
          type: array
          items: {$ref: "#/components/schemas/UsageSummaryRow"}
    BilledUnit:
      type: object
      required: [unit, quantity_micro]
      additionalProperties: false
      properties:
        unit: {type: string}
        quantity_micro: {type: integer, format: int64}
    BilledUsage:
      type: object
      required: [subscription_id, from, to, units]
      additionalProperties: false
      properties:
        subscription_id: {$ref: "#/components/schemas/KillBillId"}
        from: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        to: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        units:
          type: array
          items: {$ref: "#/components/schemas/BilledUnit"}
    BilledUsageList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BilledUsage"}
    QuotaConsume:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref: {$ref: "#/components/schemas/ExternalRef"}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000, default: 1}
        lease_seconds: {type: integer, minimum: 10, maximum: 86400, description: "The lease of a concurrent quota. Defaults to 3600."}
    QuotaRelease:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref: {$ref: "#/components/schemas/ExternalRef"}
    StaffQuotaRelease:
      type: object
      required: [ref, reason]
      additionalProperties: false
      properties:
        ref: {$ref: "#/components/schemas/ExternalRef"}
        reason: {type: string, minLength: 1, maxLength: 1000}
    QuotaExtend:
      type: object
      required: [ref, lease_seconds]
      additionalProperties: false
      properties:
        ref: {$ref: "#/components/schemas/ExternalRef"}
        lease_seconds: {type: integer, minimum: 10, maximum: 86400}
    QuotaLease:
      type: object
      required: [feature, ref, amount, expires_at]
      additionalProperties: false
      properties:
        feature: {type: string}
        ref: {$ref: "#/components/schemas/ExternalRef"}
        amount: {type: integer, format: int64}
        expires_at: {type: string, format: date-time}
    UsageRollupReassign:
      type: object
      required: [subscription, reason]
      additionalProperties: false
      properties:
        subscription: {$ref: "#/components/schemas/KillBillId"}
        reason: {type: string, minLength: 1, maxLength: 1000}
    UsageRollupDiscard:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    UsageRollup:
      type: object
      required: [id, killbill_unit, day, period_start, record_at, quantity_micro, events, killbill_tracking_id, status, attempts, forwarded_at, rejected_at, discarded_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^rol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        killbill_unit: {type: string}
        requested_subscription: {$ref: "#/components/schemas/KillBillId"}
        subscription: {$ref: "#/components/schemas/KillBillId"}
        day: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "The UTC day of the rollup, YYYY-MM-DD."}
        period_start: {type: string, format: date-time, description: The earliest event of the rollup.}
        record_at: {type: string, format: date-time, description: The latest event of the rollup and the usage record's date.}
        quantity_micro: {type: integer, format: int64}
        events: {type: integer}
        killbill_tracking_id: {type: string}
        status: {type: string, enum: [pending, forwarded, rejected, discarded]}
        reject_reason: {type: string, enum: [before_subscription_start, subscription_cancelled]}
        attempts: {type: integer}
        last_error: {type: string}
        forwarded_at: {type: [string, "null"], format: date-time}
        rejected_at: {type: [string, "null"], format: date-time}
        discarded_at: {type: [string, "null"], format: date-time}
    QuotaReleased:
      type: object
      required: [released, entitlement]
      additionalProperties: false
      properties:
        released: {type: integer, format: int64, description: "What the ref held, 0 when it held nothing."}
        entitlement: {$ref: "#/components/schemas/Entitlement"}
    MeterUnit:
      type: string
      enum: [minute, second, byte, gib_hour, request, token, count]
    MeterSpec:
      type: object
      required: [slug, unit, killbill_unit]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        unit: {$ref: "#/components/schemas/MeterUnit"}
        killbill_unit: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"}
        dimensions:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
    Meter:
      type: object
      required: [id, slug, unit, killbill_unit, dimensions, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^mtr_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        slug: {type: string}
        unit: {$ref: "#/components/schemas/MeterUnit"}
        killbill_unit: {type: string}
        dimensions:
          type: array
          items: {type: string}
        status: {type: string, enum: [active, retired]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MeterList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Meter"}
    MeterReplace:
      type: object
      required: [meters]
      additionalProperties: false
      properties:
        meters:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/MeterSpec"}
        reason: {type: string, maxLength: 1000}
    QuotaWindow:
      type: string
      enum: [none, day, month, concurrent]
    QuotaSpec:
      type: object
      required: [feature, plan, limit, window]
      additionalProperties: false
      properties:
        feature: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$"}
        plan: {type: string, minLength: 1, maxLength: 255, description: "A plan of the catalogue, or * for every plan."}
        limit: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        window: {$ref: "#/components/schemas/QuotaWindow"}
        meter: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: The meter a day or month limit counts.}
    Quota:
      type: object
      required: [id, feature, plan, limit, window, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^qta_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        feature: {type: string}
        plan: {type: string}
        limit: {type: integer, format: int64}
        window: {$ref: "#/components/schemas/QuotaWindow"}
        meter: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    QuotaList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Quota"}
    QuotaReplace:
      type: object
      required: [quotas]
      additionalProperties: false
      properties:
        quotas:
          type: array
          maxItems: 500
          items: {$ref: "#/components/schemas/QuotaSpec"}
        reason: {type: string, maxLength: 1000}
    QuotaOverrideCreate:
      type: object
      required: [feature, limit, reason]
      additionalProperties: false
      properties:
        feature: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$"}
        limit: {type: [integer, "null"], format: int64, minimum: 0, maximum: 1000000000000000, description: "The tenant's limit, or null to clear the overrides before it."}
        window: {$ref: "#/components/schemas/QuotaWindow"}
        meter: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: The meter a day or month override counts.}
        reason: {type: string, minLength: 1, maxLength: 1000}
        expires_at: {type: string, format: date-time, description: Within 10 years.}
    QuotaOverride:
      type: object
      required: [id, tenant_id, feature, limit, reason, expires_at, created_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^qta_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        tenant_id: {$ref: "#/components/schemas/TenantId"}
        feature: {type: string}
        limit: {type: [integer, "null"], format: int64}
        window: {$ref: "#/components/schemas/QuotaWindow"}
        meter: {type: string}
        reason: {type: string}
        expires_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
