killbill_plugins:
  # Core's approved install path uses pinned Java artifacts. No Ruby artifact is selected here.
  # Versions here are the Java artifacts on Maven Central (org.kill-bill.billing.plugin.java) that KPM installs at runtime.
  # This repository supplies jars to mirror sync and the DDL commands. Brand apply installs only from Core's verified mirror.
  # See docs/modules/plugins.md. The repository must be https.
  # sha256 is computed from each downloaded Maven Central jar. Published .sha256 sidecars are checked where available.
  # Core verifies the mirror response before KPM installs, and the mirror verifies and serves the exact requested digest.
  # tables are the tables the plugin's ddl.sql creates in the Kill Bill database. zs-core plugin ddl apply creates them and doctor checks them.
  # status: only required makes a plugin mandatory on every stack. Brand apply installs the plugins a brand names. verified_install records
  # that the plugin installed and started on the reference stack.
  repository: https://repo1.maven.org/maven2
  approved_payment_plugins:
    - name: stripe
      version: 8.0.3
      artifact: org.kill-bill.billing.plugin.java:stripe-plugin
      sha256: 48ae54fe99092693de2b648c6d755b44170062eee9b9a471440f4c8bff1bc0dd
      tables: [stripe_hpp_requests, stripe_responses, stripe_payment_methods]
      source: https://github.com/killbill/killbill-stripe-plugin
      status: verified_install   # installed and started on the reference stack; no live payment exercised yet
    - name: adyen
      version: 0.10.0
      artifact: org.kill-bill.billing.plugin.java:adyen-plugin
      sha256: b0e693f9748f13545a3fd41215d2dfd3fb83cbc2be5fcaa6177decbcb425aad6
      tables: [adyen_hpp_requests, adyen_responses, adyen_notifications, adyen_payment_methods]
      source: https://github.com/killbill/killbill-adyen-plugin
      status: pinned_not_installed   # installs and reaches RUNNING on the reference stack; a stack does not need it
    - name: paypal-express
      version: null
      source: https://github.com/killbill/killbill-paypal-express-plugin
      status: no_java_artifact   # no Java artifact is approved in this manifest; a Java plugin needs review before approval
  # Invoice plugins add tax or other items to Kill Bill invoices. A brand names one in billing.invoice_plugin.
  # No Java simple-tax artifact is selected in this manifest; simple-tax remains unimplemented.
  approved_invoice_plugins:
    - name: avatax
      version: 0.9.3
      artifact: org.kill-bill.billing.plugin.java:avatax-plugin
      sha256: dc48d8a8e709e13ecf176f09444c5ffd7e0337ad94140dc55d672ffa86e6e2d5
      tables: [avatax_responses, avatax_tax_codes]
      source: https://github.com/killbill/killbill-avatax-plugin
      status: pinned_not_installed   # built on the same killbill-oss-parent 0.146.63 as stripe 8.0.3; not installed on the reference stack
  installable:
    - name: email-notifications
      version: 0.8.1
      artifact: org.kill-bill.billing.plugin.java:killbill-email-notifications-plugin
      sha256: 2d953e90eea23962879d1ac8f65b1c6b944d6930f060ff72dd1ac3ca7eee7328
      tables: [email_notifications_configuration]
      source: https://github.com/killbill/killbill-email-notifications-plugin
      status: pinned_not_installed   # brand apply installs it for a brand with billing.email; verified on the reference stack
  platform_bundles_in_image:   # shipped inside killbill/killbill:0.24.22, not installed by Core
    - kpm 0.41.23 (KPM OSGi bundle)
    - logger 0.41.23
    - metrics 0.41.23
  plugin_framework: killbill-base-plugin 5.2.2
