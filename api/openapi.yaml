        "200":
          description: The quotas.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/quota-overrides:
    post:
      tags: [quotas]
      operationId: setQuotaOverride
      summary: Set a tenant's limit of a feature.
      description: |
        Staff with the `support` grant in the tenant's brand only; anyone
        else gets `404`. The latest override in force replaces the plan's
        limit until it expires. An override without `window` takes the
        window of the plan's quota, and needs a quota of the brand for the
        feature. One with `window` applies only while the plan's quota has
        that window, or while no quota covers the feature. A `null` limit
        clears the overrides before it for good, even once it expires.
        Needs a reason. Audited as `quota.override.set`.
