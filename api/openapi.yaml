openapi: 3.1.0
info:
  title: ZSoftly Core API
  version: 0.6.0
  summary: The /v1 HTTP surface of ZSoftly Core.
  description: |
    ZSoftly Core serves tenants, wallets, metering, catalogue, payments,
    notifications and audit for ZSoftly products. This document is the
    source of truth for the HTTP contract. Go request and response types are
    generated from it.

    Every response carries `Cache-Control: no-store` and an `X-Request-ID`
    header. Every error uses the error envelope. Lists are paginated with
    `limit` and `cursor` in and `next_cursor` out. Commands that change state
    carry an `idempotency_key` field in the request body.

    Every `/v1` request carries a Keycloak access token or a tenant API key
    as `Authorization: Bearer <credential>`. An API key starts with `zs_`.
    The token's issuer (one realm per brand) and its audience and authorized
    party (clients the brand's manifest declares) choose the brand, and an
    API key's prefix names it. A credential never acts outside its brand. An
    unknown realm or client is `401 token_audience_unknown`, any other
    defect is `401 token_invalid` or `401 api_key_invalid`, and when the
    signing keys or the database cannot be reached the answer is `503
    authentication_unavailable`, never 401. Staff routes also need an active
    staff grant with the named scope in the same brand; without one they
    answer `404 not_found`. When the brand's MFA policy is `required` or
    `required_for_staff`, a staff token with a grant also needs evidence of
    a second factor, `otp` or another second factor in `amr` or an `acr`
    from the brand's `mfa_acr_values`, however old: without it the answer is
    `403 mfa_required`.

    Tenant routes, `/v1/tenants/{id}/...`, need an active membership of the
    caller in the tenant, or an API key of that tenant. Without one, or when
    the tenant is closed, or for a write to a suspended tenant, the answer is
    `404 tenant_not_found`. Each route then needs a permission, and its
    absence is `403 permission_denied`. API keys work on tenant routes only,
    and never on a route that needs recent multi-factor authentication.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: health
    description: Process and readiness probes.
  - name: identity
    description: The caller's identity.
  - name: brands
    description: Brands and brand apply. Staff `operator` only.
  - name: tenants
    description: Tenants, members, teams, invitations and activation.
  - name: api-keys
    description: Tenant API keys.
  - name: audit
    description: The append-only audit trail.
  - name: billing
    description: The billing surface on Kill Bill. Kill Bill holds every balance, invoice and payment; Core stores none of them.
  - name: wallet
    description: The wallet view and reservations before work. The wallet is Kill Bill's account credit minus Core's holds.
  - name: metering
    description: Usage events with caller event IDs, forwarded to Kill Bill as usage records.
  - name: quotas
    description: Quotas and entitlements per plan and feature, with staff overrides and counters.
  - name: plugins
    description: The plugin mirror Kill Bill installs pinned plugin jars from. A deployment route, not a brand route.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Report that the process is up.
      description: Returns 200 while the process can serve HTTP. It does not check dependencies.
      responses:
        "200":
          description: The process is up.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Report that the service can take traffic.
      description: Returns 200 when the database answers and every embedded migration is applied.
      responses:
        "200":
          description: The service is ready.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Return the caller's identity.
      description: |
        Returns the identity the token represents in its brand. The identity
        is recorded on the first request with a verified email; until then
        `id` is null. `memberships` lists the caller's active memberships in
        tenants that are not closed, at most 200. A staff or service token
        has none.
      security: [{bearer: []}]
      responses:
        "200":
          description: The caller.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/brands/{id}:
    get:
      tags: [brands]
      operationId: getBrand
      summary: Return a brand.
      description: |
        Staff `operator` of the same brand only. Any other caller gets `404`.
        A staff token without a second factor gets `403 mfa_required` when
        the brand requires one for staff.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/BrandIdPath"
      responses:
        "200":
          description: The brand.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Brand"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/brands/{id}/apply:
    post:
      tags: [brands]
      operationId: applyBrand
      summary: Converge Keycloak and Kill Bill to a brand manifest.
      description: |
        Staff `operator` of the same brand only. The body is the brand
        manifest, validated against `api/schemas/brand-manifest.json`. Its
        slug must be this brand's. File references in the manifest must
        start with `<slug>/` and resolve inside `ZS_BRANDS_DIR/<slug>/`.
        Secret references must be in the brand's namespace, `BRAND_<SLUG>__`
        variables or files inside `ZS_SECRETS_DIR/<slug>/`, or the route
        answers 422 `secret_ref_invalid`. `identity.ssl_required` must be
        `external` or `all`. Apply is idempotent: applying the same manifest
        again returns an empty `changes` list. Every change is audited with
        its diff. Secrets appear only as references, and a changed secret is
        reported as a redacted field. A change to the MFA settings, a
        client, an identity provider, `ssl_required` or the payment plugin
        needs multi-factor authentication within the last 15 minutes (403
        `recent_mfa_required`) and a `reason` (400 `reason_required`). The
        route is long-running: the apply runs for up to 10 minutes and
        continues if the client disconnects. The audit trail then records
        what changed.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/BrandIdPath"
        - name: reason
          in: query
          description: Why the brand is applied. Recorded in audit and in Kill Bill. Required for a sensitive change.
          schema: {type: string, minLength: 1, maxLength: 1000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrandManifest"}
          application/yaml:
            schema: {$ref: "#/components/schemas/BrandManifest"}
      responses:
        "200":
          description: The applied diff.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrandDiff"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tenants/personal:
    post:
      tags: [tenants]
      operationId: ensurePersonalTenant
      summary: Create or return the caller's personal tenant.
      description: |
        A customer token with a verified email only. Returns the caller's
        personal tenant in the brand, creating it when there is none: one per
        identity. Creating it creates a Keycloak Organization and a Kill Bill
        account and nothing in a payment plugin. Its name is the caller's
        display name cut to 100 characters, or `Personal`. `200` returns an
        existing tenant and `201` a new one. An engine failure is a retryable
        `503`. A second request while the first is still creating the tenant
        waits up to 5 seconds and returns the same tenant, or answers a
        retryable `503 not_ready`.
      security: [{bearer: []}]
      responses:
        "200":
          description: The existing personal tenant.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "201":
          description: The personal tenant was created.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants:
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Create an organization tenant with the caller as owner.
      description: |
        A customer token with a verified email only. Requires
        `idempotency_key`, scoped to the brand and the caller: the same key
        and payload return the same tenant, a different payload is `409
        idempotency_key_conflict`. Core creates a Keycloak Organization and a
        Kill Bill account whose external key is the tenant ID, then the
        tenant. When an engine fails, no tenant is written, the failure is
        audited and the answer is a retryable `503`. A retry with the same
        key, or the sweeper, completes the same tenant.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantCreate"}
      responses:
        "201":
          description: The tenant.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}:
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Return a tenant.
      description: Needs `tenant:read`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The tenant.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    patch:
      tags: [tenants]
      operationId: updateTenant
      summary: Change a tenant's name or billing country.
      description: Needs `tenant:update`. A suspended tenant answers `404 tenant_not_found` to every write.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantUpdate"}
      responses:
        "200":
          description: The tenant.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/members:
    get:
      tags: [tenants]
      operationId: listMembers
      summary: List the tenant's members.
      description: Needs `member:read`. Removed members are not listed. Oldest first.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of members.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/members/{mem}:
    patch:
      tags: [tenants]
      operationId: updateMember
      summary: Change a member's role or suspend and reinstate a member.
      description: |
        Needs `member:update` and multi-factor authentication within the last
        15 minutes. The caller must hold every permission the member's
        current and new role imply, and only an owner changes an owner. The
        last active owner cannot be demoted or suspended: `409 last_owner`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/MembershipIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberUpdate"}
      responses:
        "200":
          description: The member.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      tags: [tenants]
      operationId: removeMember
      summary: Remove a member.
      description: |
        Needs `member:remove` and multi-factor authentication within the last
        15 minutes. The member's tokens and API keys stop working at the next
        request. The last active owner cannot be removed: `409 last_owner`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/MembershipIdPath"
      responses:
        "204":
          description: The member was removed.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/ownership/transfer:
    post:
      tags: [tenants]
      operationId: transferOwnership
      summary: Transfer ownership to an active admin.
      description: |
        The caller must be an owner with `tenant:transfer` and multi-factor
        authentication within the last 15 minutes. The target becomes an owner
        and the caller an admin, in one transaction.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OwnershipTransfer"}
      responses:
        "200":
          description: Both memberships after the transfer.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnershipTransferResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/teams:
    get:
      tags: [tenants]
      operationId: listTeams
      summary: List the tenant's teams.
      description: Needs `team:read`. Oldest first. The system teams `owners`, `admins` and `members` are locked.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of teams.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [tenants]
      operationId: createTeam
      summary: Create a team.
      description: Needs `team:manage`. The team starts with no members and no grants.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeamCreate"}
      responses:
        "201":
          description: The team.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/teams/{tm}:
    patch:
      tags: [tenants]
      operationId: updateTeam
      summary: Rename a team.
      description: Needs `team:manage` and every permission the team grants. A locked team answers `409 team_locked`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeamUpdate"}
      responses:
        "200":
          description: The team.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      tags: [tenants]
      operationId: deleteTeam
      summary: Delete a team.
      description: Needs `team:manage` and every permission the team grants. A locked team answers `409 team_locked`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/TeamIdPath"
      responses:
        "204":
          description: The team was deleted.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/teams/{tm}/members:
    put:
      tags: [tenants]
      operationId: setTeamMembers
      summary: Replace the members of a team.
      description: Needs `team:manage` and every permission the team grants. A locked team answers `409 team_locked`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeamMembers"}
      responses:
        "200":
          description: The team.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/teams/{tm}/grants:
    put:
      tags: [tenants]
      operationId: setTeamGrants
      summary: Replace the permissions a team grants.
      description: |
        Needs `team:manage`. Every permission must be built in or registered
        by the brand (`400 permission_unknown`), and the caller must hold
        every permission the team grants before and after the change.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeamGrants"}
      responses:
        "200":
          description: The team.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/invitations:
    get:
      tags: [tenants]
      operationId: listInvitations
      summary: List the tenant's invitations.
      description: Needs `member:invite`. Oldest first. Tokens are never listed.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of invitations.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [tenants]
      operationId: createInvitation
      summary: Invite an email address with a non-owner role.
      description: |
        Needs `member:invite` and every permission the role implies. The
        clear token is in this response only. It expires after 7 days. A
        personal tenant answers `409 tenant_kind_unsupported`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationCreate"}
      responses:
        "201":
          description: The invitation and its token.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/invitations/{inv}:
    delete:
      tags: [tenants]
      operationId: revokeInvitation
      summary: Revoke a pending invitation.
      description: Needs `member:invite`. An invitation that is not pending answers `404 invitation_not_found`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/InvitationIdPath"
      responses:
        "204":
          description: The invitation was revoked.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/invitations/accept:
    post:
      tags: [tenants]
      operationId: acceptInvitation
      summary: Accept an invitation.
      description: |
        A customer token with a verified email that equals the invited
        address, compared case-insensitively (`403
        invitation_email_mismatch`), and an authentication within the last 15
        minutes (`403 recent_auth_required`). An expired, revoked or unknown
        invitation answers `404 invitation_not_found`. So does an invitation
        whose inviter is no longer an active member with `member:invite` and
        every permission the invited role implies. Core then revokes it and
        audits `tenant.invitation.refused_stale_inviter`. A removed member who
        accepts gets a new membership with a new ID.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationAccept"}
      responses:
        "200":
          description: The new membership and its tenant.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/activation:
    get:
      tags: [tenants]
      operationId: getTenantActivation
      summary: Return the tenant's activation state and its latest decisions.
      description: Needs `tenant:read`. Decisions are newest first, at most 50.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The activation state.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivationState"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/activation:
    post:
      tags: [tenants]
      operationId: decideTenantActivation
      summary: Record an activation decision.
      description: |
        Staff with the `activation` grant in the tenant's brand only; anyone
        else gets `404`. A staff token without a second factor gets `403
        mfa_required` when the brand requires one for staff. Decisions are
        append-only. The route is idempotent on `request_id`: the same request
        ID and payload return the stored decision with `200`, a different
        payload is `409 idempotency_key_conflict`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivationDecisionRequest"}
      responses:
        "200":
          description: The stored decision for this request ID.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivationDecision"}
        "201":
          description: The decision was recorded.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivationDecision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List the tenant's API keys.
      description: Needs `apikey:read`. Revoked and expired keys are listed. Secrets never are.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of API keys.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKeyPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key.
      description: |
        Needs `apikey:create` and multi-factor authentication within the last
        15 minutes, so an API key cannot create another. The permissions must
        be registered and held by the caller. The key expires after 90 days
        by default and after 365 days at most. The secret is in this
        response only.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiKeyCreate"}
      responses:
        "201":
          description: The key and its secret.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKeyCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/api-keys/{key}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key.
      description: Needs `apikey:revoke`. The key stops working at once. A key of another tenant answers `404`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ApiKeyIdPath"
        - name: reason
          in: query
          description: Why the key is revoked. Recorded in audit.
          schema: {type: string, minLength: 1, maxLength: 1000}
      responses:
        "204":
          description: The key was revoked.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/audit/events:
    get:
      tags: [audit]
      operationId: listTenantAuditEvents
      summary: List the tenant's audit events.
      description: Needs `audit:read`. Newest first. Filters combine with AND.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_id
          in: query
          description: Only events by this actor.
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: action
          in: query
          description: Only events with this action, such as `tenant.member.added`.
          schema: {$ref: "#/components/schemas/Action"}
        - name: occurred_after
          in: query
          description: Only events at or after this time (RFC 3339).
          schema: {type: string, format: date-time}
        - name: occurred_before
          in: query
          description: Only events before this time (RFC 3339).
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: One page of audit events.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/audit/events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List audit events of the caller's brand.
      description: |
        Staff `operator` of the brand only. A staff token without a second
        factor gets `403 mfa_required` when the brand requires one for staff.
        Tenant members use `/v1/tenants/{id}/audit/events`. With `tenant_id`, returns the events of that tenant of the
        brand; without it, returns the brand's own events, such as brand
        applies, staff grants and new identities. Newest first. Filters
        combine with AND. `occurred_after` is inclusive and `occurred_before`
        is exclusive.
      security: [{bearer: []}]
      parameters:
        - name: tenant_id
          in: query
          description: A tenant of the caller's brand.
          schema: {$ref: "#/components/schemas/TenantId"}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_id
          in: query
          description: Only events by this actor.
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: action
          in: query
          description: Only events with this action, such as `tenant.member.added`.
          schema: {$ref: "#/components/schemas/Action"}
        - name: occurred_after
          in: query
          description: Only events at or after this time (RFC 3339).
          schema: {type: string, format: date-time}
        - name: occurred_before
          in: query
          description: Only events before this time (RFC 3339).
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: One page of audit events.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventPage"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/brands/{id}/catalogue:
    get:
      tags: [billing]
      operationId: getCatalogue
      summary: Return the brand's catalogue summary.
      description: |
        The catalogue version in force in the brand's Kill Bill tenant:
        products, plans, phases, prices in minor units and usage units. Any
        token of the brand may read it. Another brand's ID answers `404`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/BrandIdPath"
      responses:
        "200":
          description: The catalogue summary.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Catalogue"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/billing:
    get:
      tags: [billing]
      operationId: getBillingSummary
      summary: Return the tenant's billing account.
      description: |
        Needs `billing:read`. Currency, balance and account credit come from
        Kill Bill; Core stores none of them. `hold_reasons` lists why billing
        changes are on hold: `tenant_suspended`, `account_blocked`,
        `overdue_blocks_changes`, `overdue_disables_entitlement`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The billing account.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingSummary"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/subscriptions:
    get:
      tags: [billing]
      operationId: listSubscriptions
      summary: List the tenant's subscriptions.
      description: Needs `billing:read`. Every subscription of the tenant's Kill Bill account, in every state.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The subscriptions.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [billing]
      operationId: createSubscription
      summary: Subscribe the tenant to a plan.
      description: |
        Needs `billing:manage`. Idempotent on `idempotency_key`: a retry with
        the same plan returns the same subscription with `201`, another plan
        is `409 idempotency_key_conflict`. While billing changes are on hold
        the answer is `409 wallet_on_hold`. A plan Kill Bill refuses is `422
        billing_rejected` with Kill Bill's error code.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionCreate"}
      responses:
        "201":
          description: The subscription.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/subscriptions/{sub}/change:
    post:
      tags: [billing]
      operationId: changeSubscriptionPlan
      summary: Move a subscription to another plan.
      description: |
        Needs `billing:manage`. `policy` is `immediate` or `end_of_term`. The
        catalogue's change rules apply. While billing changes are on hold the
        answer is `409 wallet_on_hold`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/SubscriptionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionChange"}
      responses:
        "200":
          description: The subscription after the change.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/subscriptions/{sub}:
    delete:
      tags: [billing]
      operationId: cancelSubscription
      summary: Cancel a subscription.
      description: Needs `billing:manage`. `policy` defaults to `end_of_term`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/SubscriptionIdPath"
        - name: policy
          in: query
          schema: {type: string, enum: [immediate, end_of_term], default: end_of_term}
        - name: reason
          in: query
          description: Why, recorded in Kill Bill's audit log.
          schema: {type: string, minLength: 1, maxLength: 1000}
      responses:
        "200":
          description: The subscription after the cancellation.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/entitlements/{feature}:
    get:
      tags: [billing]
      operationId: checkEntitlement
      summary: Check whether the tenant may use a feature now.
      description: |
        Needs `tenant:read`. A feature is granted by a catalogue product name
        or a usage unit of the plan of an active subscription, or by a quota
        of the brand for an active plan or for every plan. The check fails
        closed: no active subscription, billing on hold, or Kill Bill
        unreachable all give `allowed: false` with a reason, never an error.
        A quota, or a staff override in force, caps the feature: `limit`,
        `used` and `remaining` are set, and `allowed` is false with
        `quota_exceeded` once `used` reaches `limit`. Without a quota they
        are null.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - name: feature
          in: path
          required: true
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$"}
      responses:
        "200":
          description: The answer.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/tenants/{id}/invoices:
    get:
      tags: [billing]
      operationId: listInvoices
      summary: List the tenant's invoices.
      description: Needs `billing:read`. Newest first, without items.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of invoices.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvoicePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/invoices/{inv}:
    get:
      tags: [billing]
      operationId: getInvoice
      summary: Return an invoice with its items.
      description: Needs `billing:read`. An invoice of another tenant answers `404`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200":
          description: The invoice.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/invoices/{inv}/html:
    get:
      tags: [billing]
      operationId: getInvoiceHtml
      summary: Return Kill Bill's HTML rendering of an invoice.
      description: |
        Needs `billing:read`. Kill Bill renders the invoice with the brand's
        invoice template and translations, in the locale of the tenant's
        Kill Bill account. Core sets that locale when it creates the account:
        the creator's locale when the brand offers it, otherwise the brand's
        default locale. The page carries a `Content-Security-Policy` that
        allows no script, no fetch and no form. An invoice of another tenant
        answers `404 not_found`. A template Kill Bill cannot render answers
        `503 billing_unavailable`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200":
          description: The invoice as HTML.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            text/html:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/invoices/{inv}/pdf:
    get:
      tags: [billing]
      operationId: getInvoicePdf
      summary: Return an invoice as PDF.
      description: |
        Needs `billing:read`. Core renders Kill Bill's HTML of the invoice,
        as `GET .../html` returns it, through the PDF renderer of
        `ZS_PDF_RENDERER_URL` and streams the PDF. Without a renderer an
        invoice of the tenant answers `404 invoice_pdf_unavailable`. A
        renderer that fails, or answers with something other than a PDF,
        answers `503 pdf_renderer_unavailable`. An invoice of another tenant
        answers `404 not_found`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200":
          description: The PDF.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/payments:
    get:
      tags: [billing]
      operationId: listPayments
      summary: List the tenant's payments.
      description: Needs `billing:read`. Newest first. Gateway messages are never returned.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of payments.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/payments/{pay}/refund:
    post:
      tags: [billing]
      operationId: refundPayment
      summary: Refund part or all of a payment.
      description: |
        Staff with the `billing` grant in the tenant's brand only; anyone
        else gets `404`. Needs a `reason`. Idempotent on `idempotency_key`
        for the staff member in the tenant. The amount is in minor units of
        the payment's currency. It must not exceed what the payment captured
        or purchased less what it has refunded. A larger amount is `422
        billing_rejected` with `refund_exceeds_payment` in the message, and
        Kill Bill is not called. Each refund is audited as
        `billing.payment.refunded`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/PaymentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefundRequest"}
      responses:
        "201":
          description: The payment after the refund.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/payment-methods:
    get:
      tags: [billing]
      operationId: listPaymentMethods
      summary: List the tenant's payment methods.
      description: Needs `billing:read`. Card data and plugin details are never returned.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The payment methods.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMethodList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [billing]
      operationId: addPaymentMethod
      summary: Add a payment method through the brand's payment plugin.
      description: |
        Needs `billing:manage`. With `hosted_page`, the plugin returns the
        form of its hosted payment page, which can carry the provider's
        client-side token, and the customer completes it with the provider.
        Otherwise `external_payment_method_id` carries the token the
        provider's own client library made, such as a Stripe payment method
        ID. Core never sees card data. Idempotent on `idempotency_key`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentMethodCreate"}
      responses:
        "201":
          description: The payment method, and the hosted page form when asked for.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMethodAdded"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/payment-methods/{pm}:
    delete:
      tags: [billing]
      operationId: deletePaymentMethod
      summary: Delete a payment method.
      description: Needs `billing:manage`. Kill Bill refuses to delete the default payment method with `422 billing_rejected`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/PaymentMethodIdPath"
      responses:
        "204":
          description: The payment method was deleted.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/payment-methods/{pm}/default:
    put:
      tags: [billing]
      operationId: setDefaultPaymentMethod
      summary: Make a payment method the default.
      description: Needs `billing:manage`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/PaymentMethodIdPath"
      responses:
        "200":
          description: The payment method.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMethod"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/credits/redeem:
    post:
      tags: [billing]
      operationId: redeemCreditCode
      summary: Redeem a promo or voucher code.
      description: |
        Needs `billing:manage`. Writes one Kill Bill account credit with the
        code as the reason. Idempotent per tenant and code: once the tenant
        has used the code's per-tenant limit, the answer is the latest credit
        with `200`. An unknown, disabled or expired code, or a code of another
        brand or currency, is `404 credit_code_invalid`. A code at its cap is
        `409 credit_code_exhausted`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreditRedeem"}
      responses:
        "200":
          description: The tenant's earlier credit from this code.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credit"}
        "201":
          description: The credit.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/staff/tenants/{id}/credits:
    post:
      tags: [billing]
      operationId: grantCredit
      summary: Grant a tenant a credit.
      description: |
        Staff with the `billing` grant in the tenant's brand only; anyone
        else gets `404`. Writes one Kill Bill account credit with the reason.
        With `expires_at`, the credit sweeper reverses the unused part at
        that time. Idempotent on `idempotency_key` for the staff member in
        the tenant: a retry returns the credit with `200`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreditGrant"}
      responses:
        "200":
          description: The credit of an earlier request with this key.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credit"}
        "201":
          description: The credit.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/billing/credentials:
    get:
      tags: [billing]
      operationId: getBillingCredentials
      summary: Issue a short-lived billing credential.
      description: |
        Needs `billing:manage`. Kill Bill has no short-lived tenant
        credentials, so Core issues its own 15-minute token. Send it as
        `Authorization: Bearer <token>` to the proxy route, which calls Kill
        Bill with the brand's credentials, limited to the tenant's own Kill
        Bill account. Core checks the holder's membership or API key and
        `billing:manage` again on every proxied request.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The credential.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingCredential"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/billing/proxy/{path}:
    get:
      tags: [billing]
      operationId: proxyBillingGet
      summary: Read the tenant's Kill Bill account through Core.
      description: |
        Authenticated by a billing credential, `Authorization: Bearer
        zsbc_...`. `path` is a Kill Bill path such as
        `1.0/kb/accounts/<account_id>/invoices`, with its query. Only
        `1.0/kb/accounts?externalKey=<tenant ID>` and paths under
        `1.0/kb/accounts/<account_id>` of the tenant's own account are
        accepted; anything else is `404`. Kill Bill's successful answer is
        returned as it is; a refusal is `422 billing_rejected` with Kill
        Bill's error code only.
      security: [{billingCredential: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ProxyPath"
      responses:
        "200":
          description: Kill Bill's answer.
          content:
            application/json:
              schema: {}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [billing]
      operationId: proxyBillingPost
      summary: Write to the tenant's Kill Bill account through Core.
      description: |
        Authenticated by a billing credential. Accepted: `POST
        1.0/kb/accounts/<account_id>/paymentMethods` for the tenant's own
        account with the brand's payment plugin and only the fields
        `pluginName`, `externalKey`, `pluginInfo` and `isDefault`, and `POST
        1.0/kb/subscriptions` naming the tenant's own account with only plan
        fields. A `bundleExternalKey` must be absent, null or the external
        key of one of the tenant's own bundles in Kill Bill. Price
        overrides, billing dates, payments, credits, usage and blocking
        states are refused with `404`. The tenant must be active. Each write
        is audited as `billing.proxy.write` with the Kill Bill IDs.
      security: [{billingCredential: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ProxyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: Kill Bill's answer. `Location` points at the proxy route.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/plugins/{name}/{file}:
    get:
      tags: [plugins]
      operationId: getPluginJar
      summary: Serve a pinned plugin jar from the plugin mirror.
      description: |
        KPM downloads plugin jars here when `ZS_PLUGIN_MIRROR_URL` is set.
        `file` is `<version>.jar`. The request needs the deployment's
        `ZS_PLUGIN_MIRROR_SECRET` as a bearer credential or a `token`,
        because KPM sends no headers. The token is an HMAC-SHA256 value over
        the plugin, version, and `sha256` digest under the secret. It
        authorizes only that exact jar.

        Every request, including one with bearer credentials, carries exactly
        one lowercase `sha256` query value. It must equal the
        `components.yaml` pin Core is currently serving. Before serving a jar,
        Core verifies the signed mirror manifest, the current pin, and the jar
        SHA-256, then serves a freshly verified snapshot of those exact bytes.
        It does not use a metadata checksum cache.

        An unconfigured mirror returns `404 not_found` before authentication.
        A `Bearer` authorization header takes precedence over the query token;
        a failed bearer check never falls back to the token. Without a bearer
        header, Core checks the digest-bound token. Missing or invalid selected
        credentials return `401 unauthenticated`. After valid bearer or
        digest-bound token authentication, a missing, duplicate, wrong, or
        stale serving-pin digest returns `404 not_found`.
        A failed jar digest or manifest signature check returns `500
        internal_error`, and Core logs the failure.
      security: [{mirrorSecret: []}, {}]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$"}
        - name: file
          in: path
          required: true
          description: The version followed by `.jar`, such as `8.0.3.jar`.
          schema: {type: string, pattern: "^[0-9A-Za-z.+-]{1,50}\\.jar$"}
        - name: sha256
          in: query
          required: true
          description: Exactly one lowercase SHA-256 value, equal to the currently serving `components.yaml` pin.
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
        - name: token
          in: query
          required: false
          description: The jar's HMAC-SHA256 token over the plugin, version, and sha256 digest, for KPM.
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      responses:
        "200":
          description: The jar.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/java-archive:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500":
          description: The mirror jar or signed manifest failed verification.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /v1/billing/webhooks/killbill/{brand}/{token}:
    post:
      tags: [billing]
      operationId: receiveKillBillNotification
      summary: Receive a Kill Bill push notification.
      description: |
        Kill Bill posts its push notifications here. Brand apply registers
        the URL on the brand's Kill Bill tenant. `token` is the brand's
        callback token, derived from `ZS_KILLBILL_WEBHOOK_SECRET`; a wrong
        brand or token is `404`. The notification must name an account of a
        tenant of the brand, or it is acknowledged and ignored. Notifications
        are deduplicated on the body and the state Core reads from Kill Bill
        when they arrive, so a retry is dropped and a change that sends the
        same body is not. They refresh the tenant's billing standing from
        Kill Bill, and become the Core events `billing.invoice.created`,
        `billing.payment.succeeded`, `billing.payment.failed`,
        `billing.overdue.changed` and `billing.subscription.changed` in the
        outbox.
      parameters:
        - name: brand
          in: path
          required: true
          schema: {$ref: "#/components/schemas/BrandId"}
        - name: token
          in: path
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KillBillNotification"}
      responses:
        "204":
          description: Handled, a duplicate, or ignored.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: The tenant's wallet view.
      description: |
        Needs `billing:read`. The wallet is a view: the Kill Bill account
        credit, read from Kill Bill on every call, minus what Kill Bill will
        invoice at the end of the period and has not yet, from a dry-run
        invoice read first, minus the reservations Core holds, plus the
        brand's overdraft allowance. `available_minor` is negative when the
        tenant is overspent. When the dry run fails, `unbilled_minor` and
        `available_minor` are null. Core stores none of these amounts. Below
        the brand's low-balance threshold, `low_balance` is true and
        `wallet.low_balance` is emitted at most once a day.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: The wallet.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletView"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/reservations:
    get:
      tags: [wallet]
      operationId: listReservations
      summary: List the tenant's reservations.
      description: Needs `wallet:reserve`. Newest first.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - name: status
          in: query
          schema: {type: string, enum: [held, settled, released, expired]}
        - name: external_ref
          in: query
          schema: {$ref: "#/components/schemas/ExternalRef"}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of reservations.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReservationPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [wallet]
      operationId: createReservation
      summary: Hold credit before work.
      description: |
        Needs `wallet:reserve`, which no role but owner implies. Holds
        `amount_minor` of the tenant's Kill Bill credit until the lease
        ends. The hold belongs to the membership or API key that made it.
        Available is the Kill Bill credit, minus the held reservations, less
        the unbilled amount of a Kill Bill dry-run invoice, plus the brand's
        overdraft allowance. The credit and the unbilled amount are cached
        for `ZS_WALLET_CREDIT_CACHE_TTL` only while the tenant's wallet
        version is unchanged. More than that is `409 insufficient_credit`,
        and the message names the shortfall. When Kill Bill cannot rate the
        unbilled amount it is `503 wallet_unavailable`. A suspended tenant or
        a blocked Kill Bill account is `409 wallet_on_hold`. Idempotent on
        `external_ref` and `attempt`: an equal or smaller amount returns a
        held reservation with `200`, a larger one grows it, and a hold never
        shrinks. A reservation that was settled, released or expired is `409
        reservation_closed`. Another holder's reservation is `404
        reservation_not_found`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReservationCreate"}
      responses:
        "200":
          description: The existing hold, unchanged or grown.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "201":
          description: The new hold.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/reservations/{ref}/settle:
    post:
      tags: [wallet]
      operationId: settleReservation
      summary: Settle a reservation in Kill Bill.
      description: |
        Needs `wallet:reserve`. Only the holder that made the reservation
        settles it. Anyone else gets `404 reservation_not_found`. A
        suspended tenant may settle. The settlement's catalogue value, or
        its `credit_minor`, may not exceed the hold: `409
        settlement_exceeds_hold`. A unit the subscription's phase does not
        price is `422 unit_unrated`. Core writes the settlement's intent,
        then writes to Kill Bill: usage on a subscription with a tracking ID
        derived from `external_ref` and `attempt`, or an external charge of
        `credit_minor` that Kill Bill pays from the account credit. Then the
        reservation is settled and the rest of the hold released. Kill Bill
        is never called under the tenant lock. The same settlement again
        returns it. Another one is `409 reservation_conflict`. Kill Bill
        holding another amount under the same key is `409
        settlement_conflict`. When Kill Bill cannot be reached, the answer
        is `202` with `settlement_pending: true`. The hold keeps counting
        and never expires until the sweeper completes the settlement.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ReservationRefPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReservationSettle"}
      responses:
        "200":
          description: The settled reservation.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "202":
          description: The settlement is queued until Kill Bill can be reached.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/reservations/{ref}/release:
    post:
      tags: [wallet]
      operationId: releaseReservation
      summary: Release a held reservation.
      description: |
        Needs `wallet:reserve`. Only the holder that made the reservation
        releases it. Anyone else gets `404 reservation_not_found`. A
        suspended tenant may release. Releasing a released reservation
        returns it. A settled or expired one is `409 reservation_not_held`,
        and one whose settlement waits for Kill Bill is `409
        reservation_settlement_pending`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ReservationRefPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReservationRelease"}
      responses:
        "200":
          description: The released reservation.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/reservations/{ref}/extend:
    post:
      tags: [wallet]
      operationId: extendReservation
      summary: Renew a reservation's lease.
      description: Needs `wallet:reserve`. Only the holder that made the reservation extends it. Anyone else gets `404 reservation_not_found`. A suspended tenant may extend. The lease runs `lease_seconds` from now. A reservation that is not held is `409 reservation_not_held`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/ReservationRefPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReservationExtend"}
      responses:
        "200":
          description: The reservation with its new lease.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/usage:
    post:
      tags: [metering]
      operationId: recordUsage
      summary: Record one usage event.
      description: |
        Needs `usage:write`. Idempotent on the tenant, the meter and
        `event_id`: the same payload again returns the event with `200`,
        another payload is `409 usage_event_conflict`. An unknown or retired
        meter is `404 meter_not_found`. A dimension key the meter does not
        declare is `400 validation_failed`. An `occurred_at` outside the
        brand's backfill window, seven days back and five minutes ahead by
        default, is `400 usage_out_of_window`. The forwarder sends the
        usage to Kill Bill.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageEventCreate"}
      responses:
        "200":
          description: The event recorded earlier with this event_id.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageEvent"}
        "201":
          description: The recorded event.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageEvent"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/usage/batch:
    post:
      tags: [metering]
      operationId: recordUsageBatch
      summary: Record up to 1000 usage events, all or nothing.
      description: |
        Needs `usage:write`. Each event follows the rules of `POST
        /v1/tenants/{id}/usage`. The first refused event refuses the whole
        batch and records nothing.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageBatch"}
      responses:
        "200":
          description: The events, in the order of the batch.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageBatchResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/usage/events:
    get:
      tags: [metering]
      operationId: listUsageEvents
      summary: List the tenant's usage events.
      description: Needs `usage:read`. Newest first. `from` is inclusive and `to` exclusive.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/MeterQuery"
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of usage events.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageEventPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/usage/summary:
    get:
      tags: [metering]
      operationId: getUsageSummary
      summary: The tenant's usage per meter, day and dimension set.
      description: Needs `usage:read`. Reads Core's summaries. Days are UTC, `from` inclusive and `to` exclusive, at most 366 days. Without them, the current month.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/MeterQuery"
        - $ref: "#/components/parameters/FromDay"
        - $ref: "#/components/parameters/ToDay"
      responses:
        "200":
          description: The summary.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/usage/billed:
    get:
      tags: [metering]
      operationId: getBilledUsage
      summary: The usage Kill Bill holds for the tenant's subscriptions.
      description: |
        Needs `usage:read`. Reads Kill Bill's rolled-up usage per
        subscription and unit, for one subscription of the tenant or every
        one. Days are UTC, `from` inclusive and `to` exclusive. Without
        them, the current month.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - name: subscription
          in: query
          schema: {$ref: "#/components/schemas/KillBillId"}
        - $ref: "#/components/parameters/FromDay"
        - $ref: "#/components/parameters/ToDay"
      responses:
        "200":
          description: Kill Bill's usage.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BilledUsageList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/entitlements/{feature}/consume:
    post:
      tags: [quotas]
      operationId: consumeEntitlement
      summary: Take part of a feature's quota.
      description: |
        Needs `quota:consume`, which no role but owner implies. Takes
        `amount`, 1 by default, for `ref`, such as a job ID, and answers the
        entitlement after. A concurrent quota takes it as a lease of
        `lease_seconds`, one hour by default, that the lease sweeper
        releases unless it is extended or released first. A day or month
        quota counts it against the window's counter. The same `ref` again,
        from the same holder and in the same window, takes nothing more.
        Another holder's `ref` is `404 not_found`. A feature whose quota has
        no window is `409 quota_not_concurrent`. Past the limit is `409
        quota_exceeded`. It fails closed as the check does.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/FeaturePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaConsume"}
      responses:
        "200":
          description: The entitlement after the consumption.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/entitlements/{feature}/release:
    post:
      tags: [quotas]
      operationId: releaseEntitlement
      summary: Return what a ref consumed of a feature.
      description: Needs `quota:consume`. Only the holder that consumed releases. Anyone else gets `404 not_found`. A suspended tenant may release. Releasing a ref that holds nothing returns 0, and so does a day or month consumption, which is never given back. Release never calls Kill Bill.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/FeaturePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaRelease"}
      responses:
        "200":
          description: What was returned, and the entitlement after.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaReleased"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/tenants/{id}/entitlements/{feature}/extend:
    post:
      tags: [quotas]
      operationId: extendEntitlement
      summary: Renew a concurrent lease.
      description: Needs `quota:consume`. The lease of `ref` runs `lease_seconds` from now. A ref that holds no concurrent lease, or another holder's, is `404 not_found`.
      security: [{bearer: []}]
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/FeaturePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaExtend"}
      responses:
        "200":
          description: The lease.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaLease"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/brands/{id}/meters:
    get:
      tags: [metering]
      operationId: listMeters
      summary: The brand's meters.
      description: Staff `operator` of the brand only; anyone else gets `404`. Retired meters included.
      security: [{bearer: []}]
      parameters:
